name: fraud-platform

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: fraud-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fraud_platform}
      POSTGRES_USER: ${POSTGRES_USER:-fraud_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
      - ./database/schema:/docker-entrypoint-initdb.d/schema:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fraud_user} -d ${POSTGRES_DB:-fraud_platform}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - fraud-network

  redis:
    image: redis:7-alpine
    container_name: fraud-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - fraud-network

  # ── Application services (enabled in later phases) ──

  fraud-service:
    build: ./fraud-service
    container_name: fraud-service
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - fraud-network

  # ai-service:
  #   build: ./ai-service
  #   ports:
  #     - "8000:8000"
  #   env_file: .env
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   networks:
  #     - fraud-network

volumes:
  postgres_data:

networks:
  fraud-network:
    driver: bridge
